services:
  postgres:
    image: postgres:17
    container_name: legalstream-db
    environment:
      POSTGRES_DB: legalstream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - legalstream-data:/var/lib/postgresql/data

volumes:
  legalstream-data: